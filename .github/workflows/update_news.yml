name: 毎朝6時 受験ニュース自動更新

on:
  schedule:
    # 毎朝 21:00 UTC = 日本時間(JST) 翌朝 6:00
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動でいつでも即時更新可能

# リポジトリへの書き込み権限
permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 受験ニュース取得＆AI要約の実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_news.py

      - name: 最新HTMLをGitHubにコミット＆プッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "変更はありませんでした。"
          else
            git commit -m "chore: 毎朝の受験ニュース要約を自動更新 $(date +'%Y-%m-%d %H:%M')"
            git push
          fi
