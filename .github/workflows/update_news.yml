name: 毎朝6時 受験ニュース自動更新

on:
  schedule:
    # 毎朝 19:17 UTC = 日本時間(JST) 翌朝 04:17（毎時0分の混雑回避＋朝6時までの更新完了を保証）
    - cron: '17 19 * * *'
  workflow_dispatch: # 手動でいつでも即時更新可能

# リポジトリへの書き込み権限
permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 受験ニュース取得＆AI要約の実行
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_news.py

      - name: 最新HTMLとアーカイブをGitHubにコミット＆プッシュ
        env:
          TZ: Asia/Tokyo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/archive.json
          if git diff --staged --quiet; then
            echo "変更はありませんでした。"
          else
            git commit -m "chore: 毎朝の受験ニュース要約を自動更新 $(date +'%Y-%m-%d %H:%M JST')"
            git pull --rebase origin main
            git push
          fi
